app = "jk-metering-ingest"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 30

[build]
  dockerfile = "Dockerfile"

[deploy]
  strategy = "rolling"

# Override the Dockerfile's default CMD (worker) with the ingest binary.
# Requires the Dockerfile to use CMD, not ENTRYPOINT — see Dockerfile.
[processes]
  app = "/jk-metering-ingest"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/health"

# Prometheus scrape target per the fleet-wide observability strategy.
# Served on a separate listener (:9464) so /metrics does not flow
# through the JWT auth middleware the main /metering/events route
# requires.
[metrics]
  port = 9464
  path = "/metrics"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "256mb"
  size = "shared-cpu-1x"
