name: Verify metering

# Daily end-to-end probe of the metering pipeline (E6-S3, part of
# jedi-knights/identity-platform-go#168). Emits a synthetic event via
# jk-metering-ingest, waits for the worker to mark it consumed in
# audit_events, and asserts Lago received the matching event.
#
# audit_events lives on a Fly Managed Postgres cluster (jk-identity-pg,
# shared with the identity services). MPG is not app-based, so the tunnel
# uses `fly mpg proxy <cluster-id>` — plain `flyctl proxy -a` does not
# work against MPG. All endpoints and credentials come from repo secrets
# so nothing rotatable ends up in this file.
#
# A failed run opens a GitHub issue (self-contained; upgrade to Slack/
# PagerDuty by adding a step once a webhook is provisioned).

on:
  schedule:
    # Daily at 13:00 UTC (06:00 PT). Chosen to fire after the nightly
    # heartbeat window in operator-runbook §9 has settled and while
    # the operator is awake — a failed probe should be actionable in
    # the same working day.
    - cron: "0 13 * * *"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Open MPG proxy to audit Postgres
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          nohup fly mpg proxy "${{ vars.METERING_AUDIT_PG_CLUSTER_ID }}" -p 5432 \
            > /tmp/mpg-proxy.log 2>&1 &
          echo $! > /tmp/mpg-proxy.pid
          # Wait for the tunnel to accept connections. 15s cap is
          # generous; fly mpg proxy typically binds within 2-3s.
          for _ in $(seq 1 15); do
            if nc -z 127.0.0.1 5432; then exit 0; fi
            sleep 1
          done
          echo "fly mpg proxy did not bind localhost:5432 within 15s" >&2
          cat /tmp/mpg-proxy.log >&2
          exit 1

      - name: Install psql client
        run: sudo apt-get install -y --quiet postgresql-client

      - name: Run verify-metering
        env:
          METERING_INGEST_URL: ${{ vars.METERING_INGEST_URL }}
          METERING_TEST_TOKEN: ${{ secrets.METERING_TEST_TOKEN }}
          METERING_AUDIT_DSN: ${{ secrets.METERING_AUDIT_DSN }}
          LAGO_BASE_URL: ${{ vars.LAGO_BASE_URL }}
          LAGO_API_KEY: ${{ secrets.LAGO_API_KEY }}
          POLL_TIMEOUT_SECONDS: "60"
        run: scripts/verify-metering.sh

      - name: Stop MPG proxy
        if: always()
        run: |
          if [[ -f /tmp/mpg-proxy.pid ]]; then
            kill "$(cat /tmp/mpg-proxy.pid)" 2>/dev/null || true
          fi

      - name: File issue on failure
        if: failure() && github.event_name == 'schedule'
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `verify-metering: scheduled run failed (${new Date().toISOString().slice(0, 10)})`,
              body: [
                `The daily metering pipeline probe failed.`,
                ``,
                `Run: ${runUrl}`,
                ``,
                `Runbook (per-step failure interpretation): docs/operator-runbook.md §10.`,
              ].join('\n'),
              labels: ['ops', 'metering'],
            });
